<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">matrix-max-bridge</title>
  <desc id="desc">Мост между Matrix и мессенджером MAX</desc>
  <style>
    .t { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .flow { stroke-dasharray: 3 13; animation: flow 1.6s linear infinite; }
    .flow.back { animation-direction: reverse; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .dot { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#11132e"/>
      <stop offset="1" stop-color="#1c1147"/>
    </linearGradient>
    <linearGradient id="matrix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2be3b0"/>
      <stop offset="1" stop-color="#0a9a74"/>
    </linearGradient>
    <linearGradient id="max" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#9a5bff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2be3b0"/>
      <stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d2ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
    <g id="bubble">
      <path d="M-30 -22 h60 a12 12 0 0 1 12 12 v30 a12 12 0 0 1 -12 12 h-34 l-16 14 v-14 h-10 a12 12 0 0 1 -12 -12 v-30 a12 12 0 0 1 12 -12 z" fill="#ffffff"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <circle cx="760" cy="210" r="150" fill="#1fd1a0" opacity="0.20" filter="url(#blur)"/>
    <circle cx="1150" cy="190" r="160" fill="#7a55ff" opacity="0.30" filter="url(#blur)"/>
    <circle cx="120" cy="40" r="140" fill="#3b5bff" opacity="0.12" filter="url(#blur)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g class="t">
    <text x="80" y="164" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#name)">matrix-max-bridge</text>
    <text x="82" y="214" font-size="26" font-weight="500" fill="#aeb8dc">Мост между Matrix и MAX</text>
    <g font-size="16" font-weight="600" fill="#d7ddf7" text-anchor="middle">
      <rect x="80" y="252" width="156" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="158" y="275">mautrix-python</text>
      <rect x="248" y="252" width="92" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="294" y="275">PyMax</text>
      <rect x="352" y="252" width="104" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="404" y="275">Docker</text>
      <rect x="468" y="252" width="86" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="511" y="275">MIT</text>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M800 176 C880 106 1004 106 1084 176" stroke="url(#beam)" stroke-width="2" stroke-opacity="0.25"/>
    <path d="M1084 224 C1004 294 880 294 800 224" stroke="url(#beam)" stroke-width="2" stroke-opacity="0.25"/>
    <path class="flow" d="M800 176 C880 106 1004 106 1084 176" stroke="url(#beam)" stroke-width="4"/>
    <path class="flow back" d="M800 224 C880 294 1004 294 1084 224" stroke="url(#beam)" stroke-width="4"/>
  </g>
  <g class="dot" filter="url(#glow)">
    <circle r="7" fill="#2be3b0">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M800 176 C880 106 1004 106 1084 176"/>
    </circle>
    <circle r="7" fill="#a98bff">
      <animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M1084 224 C1004 294 880 294 800 224"/>
    </circle>
  </g>

  <g filter="url(#shadow)">
    <rect x="668" y="134" width="132" height="132" rx="32" fill="url(#matrix)"/>
    <rect x="1084" y="134" width="132" height="132" rx="32" fill="url(#max)"/>
  </g>
  <rect x="668.5" y="134.5" width="131" height="131" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <rect x="1084.5" y="134.5" width="131" height="131" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <use href="#bubble" x="734" y="196"/>
  <use href="#bubble" x="1150" y="196"/>
  <g fill="#0a9a74"><circle cx="720" cy="190" r="5"/><circle cx="734" cy="190" r="5"/><circle cx="748" cy="190" r="5"/></g>
  <g fill="#6f6bff"><circle cx="1136" cy="190" r="5"/><circle cx="1150" cy="190" r="5"/><circle cx="1164" cy="190" r="5"/></g>

  <g class="t" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="734" y="306">Matrix</text>
    <text x="1150" y="306">MAX</text>
  </g>
</svg>
